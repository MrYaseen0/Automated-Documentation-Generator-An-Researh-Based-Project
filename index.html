<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative AI Documentation Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header class="bg-primary text-white p-4">
        <h1>Generative AI Documentation Generator</h1>
        <p>An Website where you can upload or paste source code and see your documentation</p>
        <p>Project of Software Architecture & Design</p>
        <p>Powered by Yaseen Ahmad</p>
    </header>

    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Left Column: Input -->
            <div class="col-md-6 p-4 border-end">
                <h3 class="mb-4">Please Input Source Code Here</h3>

                <div class="mb-4">
                    <label class="form-label">Upload Your Source Code (Python, Java, C++, JS, Go)</label>
                    <input class="form-control" type="file" id="fileInput">
                </div>

                <div class="mb-4">
                    <label class="form-label">Or Paste Code Directly:</label>
                    <textarea class="form-control" id="codeInput" rows="12" placeholder="def calculate_total(price, tax):..."></textarea>
                </div>

                <button class="btn btn-primary w-100 py-2" id="generateBtn">Generate Documentation</button>
            </div>

            <!-- Right Column: Output -->
            <div class="col-md-6 p-4">
                <h3 class="mb-4">AI-Generated Output</h3>

                <div id="loadingState" class="d-none justify-content-center align-items-center h-50">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <div id="resultsArea" class="d-none">
                    <h5 class="mb-3">Generated Docstring & Inline Comments :</h5>
                    <div class="bg-dark text-light p-4 rounded code-output">
                        <pre><code id="outputCode"></code></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
